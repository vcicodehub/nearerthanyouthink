<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160"
     role="img" aria-label="Nearer Than You Think, nearerthanyouthink.com">

  <defs>
    <!-- Warm amber glow behind the mark -->
    <radialGradient id="glow-dark" cx="50%" cy="60%" r="50%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#c4915a" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#c4915a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="160" fill="#1e1a16" rx="0"/>

  <!-- Ambient glow behind mark -->
  <ellipse cx="62" cy="76" rx="56" ry="48" fill="url(#glow-dark)"/>

  <!-- ── Sunrise mark ───────────────────────────────────── -->

  <!-- Horizon line -->
  <line x1="26" y1="92" x2="98" y2="92"
        stroke="#c4915a" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Center ray: tallest -->
  <line x1="62" y1="48" x2="62" y2="88"
        stroke="#c4915a" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Inner rays -->
  <line x1="47" y1="58" x2="47" y2="88"
        stroke="#c4915a" stroke-width="1.25" stroke-linecap="round" opacity="0.9"/>
  <line x1="77" y1="58" x2="77" y2="88"
        stroke="#c4915a" stroke-width="1.25" stroke-linecap="round" opacity="0.9"/>

  <!-- Outer rays: shortest -->
  <line x1="33" y1="70" x2="33" y2="88"
        stroke="#c4915a" stroke-width="1" stroke-linecap="round" opacity="0.65"/>
  <line x1="91" y1="70" x2="91" y2="88"
        stroke="#c4915a" stroke-width="1" stroke-linecap="round" opacity="0.65"/>

  <!-- ── Divider ─────────────────────────────────────────── -->
  <line x1="120" y1="44" x2="120" y2="116"
        stroke="#f4efe6" stroke-width="0.75" stroke-opacity="0.1"/>

  <!-- ── Wordmark ────────────────────────────────────────── -->

  <!-- "Nearer Than" in cream, "You Think" italic in amber-light -->
  <text x="140" y="88"
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-size="33" font-weight="400"
        fill="#f4efe6" letter-spacing="-0.4">Nearer Than <tspan
          font-style="italic"
          fill="#ddb07a">You Think</tspan></text>

  <!-- URL -->
  <text x="142" y="112"
        font-family="'DM Sans', -apple-system, system-ui, sans-serif"
        font-size="11" font-weight="400"
        fill="#c4915a" letter-spacing="2.2" opacity="0.6">NEARERTHANYOUTHINK.COM</text>

</svg>
