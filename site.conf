# Replaces nginx:alpine's default.conf. TLS lives at the shared edge nginx.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Prayer form -> the nearerthanyouthink-api container on the edge network.
    # Resolved per request so this container still starts if the API is down.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api nearerthanyouthink-api;
        proxy_pass http://$api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        client_max_body_size 32k;
    }
}
