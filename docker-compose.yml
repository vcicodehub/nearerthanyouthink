services:
  nearerthanyouthink:
    image: ${NTYT_IMAGE:-ghcr.io/vcicodehub/nearerthanyouthink:latest}
    container_name: nearerthanyouthink
    restart: unless-stopped
    networks:
      - web

  nginx:
    image: nginx:alpine
    container_name: nearerthanyouthink-nginx
    restart: unless-stopped
    depends_on:
      - nearerthanyouthink
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot
    networks:
      - web

networks:
  web:
